server {
    listen 80;
    server_name example.com;

    root /opt/docker/store/data/www;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    # CF-Connecting-IP
    # real_ip_recursive on;

    client_max_body_size 50m;
    client_body_buffer_size 16k;
    client_body_timeout 120s;
    send_timeout 120s;
    keepalive_timeout 75s;

    location ~ (^|/)\. {
        return 404;
    }

    location ~* ^/(?:runtime|kernel|config|vendor)(?:/|$) {
        return 404;
    }

    location ~* /(?:\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules)(?:/|$) {
        return 404;
    }

    location ~* \.(?:log|sql|sqlite|db|db-wal|db-shm|bak|backup|old|save|orig|swp|swo|tmp|temp|ini|lock)$ {
        return 404;
    }

    location ~* /(?:\.user\.ini|\.htaccess|\.htpasswd|\.env(?:\..*)?|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG(?:\.md)?|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|docker-compose\.ya?ml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.(?:toml|lock)|go\.(?:mod|sum)|phpunit\.xml|pom\.xml|build\.gradle|settings\.gradle|gradle\.properties|pyproject\.toml|requirements\.txt|application(?:-\w+)?\.(?:ya?ml|properties)|.*~)$ {
        return 404;
    }

    location = / {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass unix:/opt/docker/store/data/php/php-fpm.sock;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;

        fastcgi_param HTTP_HOST $host;

        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
    }

    access_log /www/wwwlogs/example.com.log;
    error_log /www/wwwlogs/example.com.error.log;
}
